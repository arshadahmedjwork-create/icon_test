    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --background-color: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .id-card {
            width: 3in;
            height: 4in;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #ccc;
            page-break-inside: avoid;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 20px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .photo-placeholder {
            width: 80px;
            height: 80px;
            background-color: var(--background-color);
            border-radius: 50%;
            margin: -40px auto 10px;
            border: 4px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #bdc3c7;
            font-size: 2rem;
        }

        .content {
            padding: 10px 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0 5px;
            min-height: 2.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .role {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .details {
            font-size: 0.8rem;
            color: #555;
            text-align: left;
            margin-top: auto;
            margin-bottom: 20px;
            width: 100%;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        .details-label {
            font-weight: bold;
            color: #7f8c8d;
        }

        .footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.7rem;
        }

        .qr-placeholder {
            position: absolute;
            bottom: 40px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #eee;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.5rem;
            color: #999;
        }

        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .id-card {
                box-shadow: none;
                border: 1px dashed #ccc;
            }
            @page {
                margin: 0.5in;
            }
        }
    </style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rawData = document.getElementById('raw-data').textContent.trim();
        const lines = rawData.split('\n').filter(line => line.trim() !== '');
        
        const delegates = lines.map(line => {
            const parts = line.trim().split(' ');
            const sno = parts[0];
            const regId = parts[1];
            
            // Reconstruct the rest
            const rest = parts.slice(2).join(' ');
            
            // Find email (contains @)
            const emailMatch = rest.match(/[\w\.-]+@[\w\.-]+\.\w+/);
            const email = emailMatch ? emailMatch[0] : '';
            
            // Find mobile (10 digits or more, maybe spaces)
            const mobileMatch = rest.match(/\b\d{7,12}\b/);
            const mobile = mobileMatch ? mobileMatch[0] : '';
            
            // Name is before email/mobile
            let name = rest;
            if (email) {
                name = name.split(email)[0].trim();
            } else if (mobile) {
                name = name.split(mobile)[0].trim();
            } else if (rest.includes('PCC')) {
                name = name.split('PCC')[0].trim();
            }
            
            return {
                sno,
                regId,
                name: name || 'Delegate',
                role: 'Delegate'
            };
        });

        delegates.forEach(delegate => {
            const card = document.createElement('div');
            card.className = 'id-card';
            card.innerHTML = `
                <div class="header">
                    <h1>MIDAS 5</h1>
                    <p>Annual Conference</p>
                </div>
                <div class="photo-placeholder">👤</div>
                <div class="content">
                    <div class="name">${delegate.name}</div>
                    <div class="role">${delegate.role}</div>
                    
                    <div class="details">
                        <div class="details-row">
                            <span class="details-label">Reg ID:</span>
                            <span>${delegate.regId}</span>
                        </div>
                        <div class="details-row">
                            <span class="details-label">S.No:</span>
                            <span>${delegate.sno}</span>
                        </div>
                    </div>
                </div>
                <div class="qr-placeholder">QR</div>
                <div class="footer">
                    Valid for all conference days
                </div>
            `;
            document.body.appendChild(card);
        });
    });
</script>
